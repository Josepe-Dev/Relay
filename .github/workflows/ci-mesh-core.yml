name: Mesh Core CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/mesh-core/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-mesh-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/mesh-core/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-mesh-core.yml"
  workflow_dispatch:

jobs:
  mesh_core_tests:
    name: Build & Test :packages:mesh-core (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Mesh Core unit tests
        run: ./gradlew --no-daemon :packages:mesh-core:jvmTest
